services:
  - type: web
    name: ecommerce-api-docker
    runtime: docker
    region: singapore
    plan: free
    repo: https://github.com/Phusssss/ecommerce-api-docker.git
    branch: main
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ecommerce-demo-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production

databases:
  - name: ecommerce-demo-db
    region: singapore
